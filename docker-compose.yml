name: belltower

services:
  belltower:
    image: belltower:latest
    build: .
    container_name: belltower
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./data:/data
      - ./providers.yaml:/providers.yaml:ro
    environment:
      - BELLTOWER_POLL_INTERVAL=10m
      - BELLTOWER_POLL_TIMEOUT=10s
      - BELLTOWER_CONCURRENCY=20
    mem_limit: 512m
    # To run unprivileged: chown ./data to this uid first, then uncomment.
    # user: "1000:1000"
    # The image declares its own HEALTHCHECK (the binary's healthcheck
    # subcommand); scratch has no shell or curl for a CMD-SHELL probe.
