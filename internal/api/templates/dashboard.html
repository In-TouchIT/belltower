<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belltower Status Dashboard</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #1a1a2e;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --green: #00c851;
            --amber: #ffab00;
            --red: #cc0000;
            --blue: #2979ff;
            --gray: #616161;
            --border: #333;
            --manual-bg: #2a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: var(--blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 .bell {
            /* Keep the emoji at its own colour rather than inheriting --blue. */
            color: initial;
            font-size: 1.6rem;
            line-height: 1;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stat-badge {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-badge.healthy { border-color: var(--green); color: var(--green); }
        .stat-badge.degraded { border-color: var(--amber); color: var(--amber); }
        .stat-badge.outage { border-color: var(--red); color: var(--red); }
        .stat-badge.unknown { border-color: var(--gray); color: var(--text-secondary); }
        .stat-badge .count { font-size: 1.2rem; font-weight: bold; }
        .category-title {
            font-size: 1.2rem;
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border);
            color: var(--blue);
        }
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            margin-bottom: 10px;
        }
        .provider-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .provider-card:hover {
            border-color: var(--blue);
        }
        .provider-card.operational { border-left: 3px solid var(--green); }
        .provider-card.degraded { border-left: 3px solid var(--amber); }
        .provider-card.outage { border-left: 3px solid var(--red); background: rgba(204, 0, 0, 0.05); }
        .provider-card.unknown { border-left: 3px solid var(--gray); }
        .provider-card.maintenance { border-left: 3px solid var(--blue); }
        .provider-card.manual { background: var(--manual-bg); border-left: 3px solid var(--gray); }
        .provider-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 3px;
        }
        .provider-category {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .provider-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-dot.operational { background: var(--green); }
        .status-dot.degraded { background: var(--amber); }
        .status-dot.outage { background: var(--red); }
        .status-dot.unknown { background: var(--gray); }
        .status-dot.maintenance { background: var(--blue); }
        .provider-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .tier-badge {
            background: rgba(41, 121, 255, 0.2);
            color: var(--blue);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .stale-badge {
            background: rgba(255, 171, 0, 0.2);
            color: var(--amber);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .incidents-section {
            margin-top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
        }
        .incident-item {
            background: rgba(204, 0, 0, 0.1);
            border-radius: 4px;
            padding: 10px;
            margin-top: 8px;
            border-left: 2px solid var(--red);
        }
        .incident-item.minor { border-left-color: var(--amber); background: rgba(255, 171, 0, 0.1); }
        .incident-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .incident-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .manual-section {
            margin-top: 30px;
            padding: 15px;
            background: var(--manual-bg);
            border: 1px dashed var(--gray);
            border-radius: 6px;
        }
        .manual-title {
            color: var(--amber);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .manual-provider {
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .manual-provider:last-child { border-bottom: none; }
        .manual-link {
            color: var(--blue);
            text-decoration: none;
        }
        .manual-link:hover { text-decoration: underline; }
        .refresh-info {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 20px;
        }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div id="app">
        <h1><span class="bell" role="img" aria-label="Belltower">🔔</span>Belltower Status Dashboard</h1>
        <div class="subtitle">Loading…</div>
        
        <div class="stats-bar" id="stats-bar">
            <div class="loading">Loading overview...</div>
        </div>

        <div id="dashboard-content">
            <div class="loading">Loading provider statuses...</div>
        </div>
    </div>

    <script>
        // Every value below originates from a third-party vendor status feed.
        // It is untrusted input, so nothing reaches the DOM as markup:
        // text goes through esc(), URLs through safeURL().
        function esc(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Only http(s) links are emitted, so a javascript: or data: URL in a
        // feed cannot become a clickable script.
        function safeURL(value) {
            if (!value) return '';
            try {
                const parsed = new URL(value, window.location.origin);
                if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
                return esc(parsed.href);
            } catch (e) {
                return '';
            }
        }

        function fmtTime(value) {
            if (!value) return 'unknown';
            const d = new Date(value);
            if (isNaN(d.getTime()) || d.getFullYear() < 1980) return 'unknown';
            return d.toLocaleString();
        }

        // Health is read from the indicator, never from `ok`.
        //
        // `ok` only reports whether the poll reached the provider: a vendor
        // that answers promptly while announcing a critical outage still has
        // ok === true, so gating on it rendered live outages as "Operational".
        const STATES = {
            none:        { cls: 'operational',  label: 'Operational' },
            minor:       { cls: 'degraded',     label: 'Degraded' },
            major:       { cls: 'outage',       label: 'Outage' },
            critical:    { cls: 'outage',       label: 'Major Outage' },
            maintenance: { cls: 'maintenance',  label: 'Maintenance' },
            unknown:     { cls: 'unknown',      label: 'Unknown' }
        };

        function stateFor(provider) {
            const state = STATES[provider.indicator];
            if (state) return state;
            // An unrecognised indicator is surfaced as unknown, not assumed healthy.
            return STATES.unknown;
        }

        function providerCard(p) {
            const state = stateFor(p);
            const detail = !p.ok && p.error ? `<div class="provider-meta" title="${esc(p.error)}">unreachable</div>` : '';
            return `<div class="provider-card ${state.cls}" data-page-url="${safeURL(p.page_url)}">
                <div class="provider-name">${esc(p.name)}</div>
                <div class="provider-category">${esc(p.category)}</div>
                <div class="provider-status">
                    <span class="status-dot ${state.cls}"></span>
                    <span>${esc(state.label)}</span>
                </div>
                <div class="provider-meta">
                    <span class="tier-badge">Tier ${esc(p.tier)}</span>
                    <span>${esc(p.adapter)}</span>
                </div>
                ${detail}
            </div>`;
        }

        function renderStats(stats) {
            document.getElementById('stats-bar').innerHTML = `
                <div class="stat-badge healthy"><span class="count">${esc(stats.operational)}</span> Operational</div>
                <div class="stat-badge degraded"><span class="count">${esc(stats.degraded)}</span> Degraded</div>
                <div class="stat-badge outage"><span class="count">${esc(stats.outages)}</span> Outages</div>
                <div class="stat-badge"><span class="count">${esc(stats.maintenance)}</span> Maintenance</div>
                <div class="stat-badge unknown"><span class="count">${esc(stats.unknown)}</span> Unknown</div>
                <div class="stat-badge"><span class="count">${esc(stats.unmonitored)}</span> Manual Check</div>
                <div class="stat-badge"><span class="count">${esc(stats.open_incidents)}</span> Open Incidents</div>
                <div class="stat-badge"><span class="count">${esc(stats.total_providers)}</span> Total</div>`;
        }

        async function loadDashboard() {
            try {
                const resp = await fetch('/api/v1/snapshot');
                if (!resp.ok) throw new Error('Failed to fetch snapshot (HTTP ' + resp.status + ')');
                const data = await resp.json();

                renderStats(data.stats);

                const categories = {};
                const manualProviders = [];
                data.providers.forEach(p => {
                    if (p.adapter === 'manual') { manualProviders.push(p); return; }
                    (categories[p.category] = categories[p.category] || []).push(p);
                });

                let html = '';

                Object.keys(categories).sort().forEach(cat => {
                    const providers = categories[cat];
                    providers.sort((a, b) => (a.tier - b.tier) || a.name.localeCompare(b.name));

                    let up = 0, issues = 0, unknown = 0;
                    providers.forEach(p => {
                        const cls = stateFor(p).cls;
                        if (cls === 'operational') up++;
                        else if (cls === 'outage' || cls === 'degraded') issues++;
                        else unknown++;
                    });

                    html += `<div class="category-section">
                        <div class="category-title">${esc(cat)} (${providers.length})
                            <span style="font-size:0.8rem;color:var(--text-secondary);">
                                ${up} up, ${issues} issues, ${unknown} unknown
                            </span>
                        </div>
                        <div class="providers-grid">`;
                    providers.forEach(p => { html += providerCard(p); });
                    html += '</div></div>';
                });

                if (manualProviders.length > 0) {
                    html += `<div class="manual-section">
                        <div class="manual-title">Manual Checks Required (${manualProviders.length})</div>`;
                    manualProviders.sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
                        const href = safeURL(p.page_url);
                        const link = href ? `<a href="${href}" class="manual-link" target="_blank" rel="noopener noreferrer">View Status</a>` : '';
                        html += `<div class="manual-provider">${esc(p.name)} — ${esc(p.category)} ${link}</div>`;
                    });
                    html += '</div>';
                }

                if (data.incidents && data.incidents.length > 0) {
                    html += `<div class="incidents-section">
                        <div class="category-title">Active Incidents (${data.incidents.length})</div>`;
                    data.incidents.forEach(inc => {
                        const body = inc.body ? (inc.body.length > 200 ? inc.body.substring(0, 197) + '...' : inc.body) : '';
                        const href = safeURL(inc.url);
                        const link = href ? ` <a href="${href}" class="manual-link" target="_blank" rel="noopener noreferrer">details</a>` : '';
                        html += `<div class="incident-item">
                            <div class="incident-title">${esc(inc.title || 'Untitled Incident')}
                                <span style="font-size:0.7rem; opacity:0.8;">[${esc(inc.status || 'unknown')}]</span>${link}</div>
                            <div class="incident-meta" style="margin-bottom:5px;">
                                Provider: ${esc(inc.provider_id)} | Impact: ${esc(inc.impact || 'unknown')} |
                                Started: ${esc(fmtTime(inc.started_at))}
                            </div>
                            ${body ? `<div class="incident-body" style="font-size:0.8rem; color:var(--text); opacity:0.9;">${esc(body)}</div>` : ''}
                        </div>`;
                    });
                    html += '</div>';
                }

                document.getElementById('dashboard-content').innerHTML = html;
                document.querySelector('.subtitle').textContent =
                    `Monitoring ${data.stats.total_providers} vendor status pages — updated ${fmtTime(data.built_at)}`;
            } catch (e) {
                const content = document.getElementById('dashboard-content');
                content.textContent = 'Error loading dashboard: ' + e.message;
            }
        }

        // One delegated listener rather than an inline onclick per card, so a
        // provider name containing a quote cannot break out into script.
        document.getElementById('dashboard-content').addEventListener('click', ev => {
            const card = ev.target.closest('.provider-card');
            if (!card) return;
            const url = card.getAttribute('data-page-url');
            if (url) window.open(url, '_blank', 'noopener,noreferrer');
        });

        loadDashboard();
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>
