<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <title>Belltower Status Dashboard</title>
    <script src="/static/htmx.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #1a1a2e;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --green: #00c851;
            --amber: #ffab00;
            --red: #cc0000;
            --blue: #2979ff;
            --gray: #616161;
            --border: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-badge {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .stat-badge.healthy { border-color: var(--green); color: var(--green); }
        .stat-badge.degraded { border-color: var(--amber); color: var(--amber); }
        .stat-badge.outage { border-color: var(--red); color: var(--red); }
        .stat-badge.unknown { border-color: var(--gray); color: var(--text-secondary); }
        .category-section {
            margin-bottom: 30px;
        }
        .category-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border);
        }
        .providers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .provider-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            transition: border-color 0.2s;
        }
        .provider-card.operational { border-left: 3px solid var(--green); }
        .provider-card.degraded { border-left: 3px solid var(--amber); }
        .provider-card.outage { border-left: 3px solid var(--red); }
        .provider-card.unknown { border-left: 3px solid var(--gray); }
        .provider-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 5px;
        }
        .provider-category {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .provider-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.operational { background: var(--green); }
        .status-dot.degraded { background: var(--amber); }
        .status-dot.outage { background: var(--red); }
        .status-dot.unknown { background: var(--gray); }
        .status-dot.maintenance { background: var(--blue); }
        .incidents-list {
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .incident-item {
            background: rgba(204, 0, 0, 0.1);
            border-radius: 3px;
            padding: 5px 8px;
            margin-top: 5px;
        }
        .stale-badge {
            background: rgba(255, 171, 0, 0.2);
            color: var(--amber);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            margin-left: auto;
        }
        .provider-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .manual-section {
            background: rgba(97, 97, 97, 0.1);
            border: 1px dashed var(--gray);
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
        }
        .refresh-hint {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="dashboard">
        <h1>Belltower Status Dashboard</h1>
        <div class="subtitle">Monitoring vendor status pages — auto-refresh every 60s</div>
        
        <div class="stats-bar" id="stats">
            <!-- Stats will be loaded here -->
        </div>

        <div id="categories">
            <!-- Categories will be loaded here -->
        </div>
    </div>

    <script>
        // Fetch and render the snapshot
        async function loadDashboard() {
            try {
                const resp = await fetch('/api/v1/snapshot');
                if (!resp.ok) throw new Error('Failed to fetch snapshot');
                const data = await resp.json();
                
                // Render stats
                const stats = data.stats;
                const statsEl = document.getElementById('stats');
                statsEl.innerHTML = `
                    <div class="stat-badge healthy">Operational: ${stats.operational}</div>
                    <div class="stat-badge.degraded">Degraded: ${stats.degraded}</div>
                    <div class="stat-badge.outage">Outages: ${stats.outages}</div>
                    <div class="stat-badge unknown">Unknown: ${stats.unknown}</div>
                    <div class="stat-badge">Maintenance: ${stats.maintenance}</div>
                    <div class="stat-badge">Unmonitored: ${stats.unmonitored}</div>
                    <div class="stat-badge">Open Incidents: ${stats.open_incidents}</div>
                    <div class="stat-badge">Last Updated: ${new Date(data.built_at).toLocaleTimeString()}</div>
                `;
                
                // Group providers by category
                const categories = {};
                data.providers.forEach(p => {
                    if (!categories[p.category]) categories[p.category] = [];
                    categories[p.category].push(p);
                });
                
                // Sort categories alphabetically
                const sortedCats = Object.keys(categories).sort();
                
                const categoriesEl = document.getElementById('categories');
                let html = '';
                
                sortedCats.forEach(cat => {
                    const providers = categories[cat];
                    // Sort by tier then name
                    providers.sort((a, b) => {
                        if (a.tier !== b.tier) return a.tier - b.tier;
                        return a.name.localeCompare(b.name);
                    });
                    
                    html += `<div class="category-section">
                        <div class="category-title">${cat} (${providers.length})</div>
                        <div class="providers-grid">`;
                    
                    providers.forEach(p => {
                        let statusClass = 'operational';
                        let statusText = 'Operational';
                        let statusDot = 'operational';
                        
                        if (p.adapter === 'manual') {
                            statusClass = 'unknown';
                            statusText = 'Manual Check';
                            statusDot = 'unknown';
                        } else if (!p.ok) {
                            if (p.indicator === 'minor' || p.indicator === 'degraded') {
                                statusClass = 'degraded';
                                statusText = 'Degraded';
                                statusDot = 'degraded';
                            } else if (p.indicator === 'major' || p.indicator === 'critical') {
                                statusClass = 'outage';
                                statusText = 'Outage';
                                statusDot = 'outage';
                            } else if (p.indicator === 'maintenance') {
                                statusClass = 'unknown';
                                statusText = 'Maintenance';
                                statusDot = 'maintenance';
                            } else {
                                statusClass = 'unknown';
                                statusText = 'Unknown';
                                statusDot = 'unknown';
                            }
                        }
                        
                        html += `<div class="provider-card ${statusClass}">
                            <div class="provider-row">
                                <div>
                                    <div class="provider-name">${p.name}</div>
                                    <div class="provider-category">${p.category}</div>
                                </div>
                                <div class="stale-badge">Tier ${p.tier}</div>
                            </div>
                            <div class="provider-status">
                                <span class="status-dot ${statusDot}"></span>
                                <span>${statusText}</span>
                            </div>
                        </div>`;
                    });
                    
                    html += '</div></div>';
                });
                
                categoriesEl.innerHTML = html;
                
            } catch (e) {
                document.getElementById('dashboard').innerHTML = 
                    '<h1>Error Loading Dashboard</h1><p>' + e.message + '</p>';
            }
        }
        
        // Load on startup
        loadDashboard();
        
        // Refresh every 60 seconds
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>
